# --- Daemon / 内存 ---
# GitHub Actions runner: 4-core / 16GB；给 Gradle 6g 留足 R8/lint 峰值空间
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
# CI 环境用 --no-daemon 覆盖此值，本地用 daemon 提速
org.gradle.parallel=true
org.gradle.caching=true

# KSP 已替代 kapt，configuration-cache 可安全开启
org.gradle.configuration-cache=true

# 文件系统监听（CI 无持久 daemon，关闭减少无效开销）
org.gradle.vfs.watch=false

# --- Kotlin 编译器 ---
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# Kotlin daemon 与 Gradle daemon 共享 runner 内存，3g 足够编译 + KSP
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
# kapt 已迁移到 KSP，以下不再需要
# kapt.use.k2=true
# kapt.incremental.apt=true

# --- KSP / Room ---
# KSP 增量处理：仅重新生成变更的 Entity/DAO，避免全量重跑 Room 代码生成
ksp.incremental=true
ksp.incremental.intermodule=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
