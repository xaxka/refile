# --- Daemon / 内存 ---
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# configuration-cache 在 kapt+Hilt 下偶发不兼容，暂不开启
org.gradle.configuration-cache=false

# 文件系统监听（CI 几乎无效，但无风险）
org.gradle.vfs.watch=true

# --- Kotlin 编译器 ---
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
kapt.use.k2=true
kapt.incremental.apt=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Proxy（沙箱环境通过本地代理访问 Maven Central / Gradle Plugin Portal）---
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local
