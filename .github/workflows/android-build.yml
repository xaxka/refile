name: Android Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

# 同分支连推时取消旧 run，节省 CI 资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # main 分支可写缓存供其它分支/PR 复用；非 main 分支只读，避免缓存污染
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Run :core JVM tests
        run: ./gradlew :core:test --console=plain --build-cache --parallel

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain --build-cache --parallel

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Delete previous dev release & tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev
          body: |
            Automated dev build.

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
