name: Static Analysis

on:
  # Task 22：手动触发，检查代码风格与潜在问题（Detekt + Ktlint）。
  # 不在普通 push 上跑，避免与 build-release 流水线叠加拖慢 CI。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Run Ktlint (core + app)
        run: ./gradlew ktlintCheck --no-daemon --build-cache --parallel

      - name: Run Detekt (core + app)
        run: ./gradlew detekt --no-daemon --build-cache --parallel

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: |
            core/build/reports/detekt/**
            app/build/reports/detekt/**
          if-no-files-found: ignore
